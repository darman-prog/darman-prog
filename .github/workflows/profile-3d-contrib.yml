name: Gráfica 3D de contribuciones

on:
  schedule:
    - cron: "0 6 * * *"  # 6am UTC (ajusta a tu zona)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generar gráfica 3D
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          MAX_LANGUAGES: 5
          SETTING_JSON: profile-3d-contrib/settings.json

      - name: Commit y push del resultado
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib/
          git diff --staged --quiet || git commit -m "chore: actualiza gráfica 3D [skip ci]"
          git push