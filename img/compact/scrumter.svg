<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" role="img" aria-labelledby="t d">
  <title id="t">Scrumter</title>
  <desc id="d">Scrumter, gestión de proyectos Scrum con IA. React, TypeScript, Vite y Tailwind.</desc>
  <defs>
